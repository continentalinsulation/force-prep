<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Evolution</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Evolution">
<meta name="theme-color" content="#0c0c0b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&family=Share+Tech+Mono&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&family=Share+Tech+Mono&display=swap"></noscript>
<style>
/* Evolution v2 — black / bone / flat dark earth. Red only on a fail. */
:root{
  --bg:#0a0a09; --bg2:#101010; --surface:#151512; --raise:#1d1d19; --fg:#efece4; --muted:#8e8a80; --line:#27261f; --line2:#33312a;
  --accent:#c4a470; --accent-deep:#8f7447; --accent-fg:#0f0d08; --accent-soft:#272117; --bad:#c8452f; --bad-soft:#3a1c17;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif; --body:"Barlow","Helvetica Neue",Arial,sans-serif; --mono:"Share Tech Mono","Menlo","Consolas",monospace;
  --r:14px; --tab:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#f4f2ec; --bg2:#ecebe4; --surface:#ffffff; --raise:#f1efe8; --fg:#121211; --muted:#6a675f; --line:#dcd9d0; --line2:#cfccc2; --accent:#8c6e3f; --accent-deep:#6b5430; --accent-fg:#ffffff; --accent-soft:#ece3d0; --bad:#b33f2e; --bad-soft:#f3d6d0; color-scheme:light }}
:root[data-theme="light"]{ --bg:#f4f2ec; --bg2:#ecebe4; --surface:#ffffff; --raise:#f1efe8; --fg:#121211; --muted:#6a675f; --line:#dcd9d0; --line2:#cfccc2; --accent:#8c6e3f; --accent-deep:#6b5430; --accent-fg:#ffffff; --accent-soft:#ece3d0; --bad:#b33f2e; --bad-soft:#f3d6d0; color-scheme:light }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{touch-action:manipulation;-webkit-text-size-adjust:100%} body{touch-action:manipulation} input,select,textarea{font-size:16px}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1;text-wrap:balance}
h1{font-size:2.4rem;text-transform:uppercase;letter-spacing:.01em} h2{font-size:1.5rem} h3{font-size:1.15rem}
.eyebrow{font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:.95rem}
#app{min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:calc(var(--tab) + 28px + env(safe-area-inset-bottom,0px));max-width:620px;width:100%;margin:0 auto}
.view{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)} .view > *{min-width:0}
main.go{animation:slidein .2s cubic-bezier(.2,.7,.2,1) both} main.goback{animation:slideback .2s cubic-bezier(.2,.7,.2,1) both}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes slideback{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.top .l{display:flex;align-items:center;gap:10px;min-width:0} .top .date{color:var(--muted);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .date b{color:var(--fg);font-weight:600}
.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn.txt{width:auto;padding:0 14px;border-radius:999px;font-weight:600;font-size:.95rem}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;height:calc(var(--tab) + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 0;min-width:0;display:grid;gap:3px;justify-items:center;align-content:start;color:var(--muted);font-weight:600;font-size:.7rem;cursor:pointer;position:relative}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--fg)} nav.tabs button.on svg{stroke:var(--accent)}
nav.tabs button.on::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:28px;height:2px;background:var(--accent)}

/* mission header — the one bold element */
.mh{display:grid;gap:4px;padding:6px 0 2px}
.mh .num{font-family:var(--mono);font-size:5.4rem;line-height:.85;letter-spacing:-.04em;color:var(--fg);font-variant-numeric:tabular-nums}
.mh .num i{font-style:normal;color:var(--line2)}
.mh .kind{font-size:.85rem;font-weight:600;color:var(--accent);margin-top:8px;display:flex;align-items:center;gap:8px}
.mh .title{font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:.92;text-transform:uppercase;letter-spacing:.005em;margin-top:2px}
.mh .title small{display:block;font-size:1.25rem;color:var(--muted);letter-spacing:.02em;margin-top:4px;text-transform:none;font-weight:600}
.mh .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:.95rem;margin-top:8px} .mh .meta b{color:var(--fg);font-weight:600;font-family:var(--mono)}
.mh .sub2{color:var(--muted);font-size:1rem;max-width:40ch;margin-top:6px}
.mh.compact .num{font-size:2.4rem} .mh.compact .title{font-size:1.9rem} .mh.compact{grid-template-columns:auto 1fr;gap:4px 14px;align-items:end}
.mh.compact .num{grid-row:1 / span 2} .mh.compact .kind{margin-top:0} .mh.compact .meta{grid-column:2}
.mh.secured .num{color:var(--accent)}

/* buttons */
.btn{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:1.15rem;padding:14px 18px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;text-align:center;transition:transform .06s}
.btn:active{transform:scale(.98)}
.btn.quiet{background:var(--surface);border-color:var(--line2);color:var(--fg)}
.btn.big{font-size:1.4rem;padding:18px 20px;width:100%;border-radius:14px}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.mini{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.88rem;cursor:pointer;color:var(--fg);font-weight:600}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.startrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}
.startrow .ibtn{width:58px;height:auto;border-radius:14px}

/* cards & structure */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.hi{border-color:var(--accent-deep)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:grid;gap:10px}
.pill{font-family:var(--mono);font-size:.82rem;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.sect{display:grid;gap:10px} .sect > .row:first-child{min-height:28px}
.sect .eyebrow{font-size:.95rem;color:var(--fg)} .sect .eyebrow span{color:var(--muted);font-weight:400;margin-left:6px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{padding:11px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--raise);color:var(--fg);width:100%;min-width:0;font-variant-numeric:tabular-nums}
textarea{min-height:80px;resize:vertical}
.field{display:grid;gap:5px} .field label{font-size:.85rem;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px} .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.note{background:var(--accent-soft);border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 10px 10px 0;font-size:.95rem} .note b{color:var(--accent)}
.sim-prep{background:var(--accent-soft);border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 10px 10px 0;font-size:.95rem}
.line{font-family:var(--display);font-weight:600;font-size:1.35rem;line-height:1.1;text-wrap:balance;color:var(--fg)}
.line::before{content:"";display:inline-block;width:14px;height:3px;background:var(--accent);vertical-align:middle;margin-right:10px}

/* numbers row */
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums > div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;display:grid;gap:2px}
.nums .v{font-family:var(--mono);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums} .nums .v em{font-style:normal;color:var(--muted);font-size:1.1rem}
.nums .l{font-size:.8rem;color:var(--muted)}
.nums .dots{display:flex;gap:5px;margin-top:6px} .dots i{width:9px;height:9px;border-radius:50%;background:var(--raise);border:1px solid var(--line2);display:block} .dots i.y{background:var(--accent);border-color:var(--accent)} .dots i.miss{border-color:var(--bad)} .dots i.off{opacity:.3} .dots i.t{border-color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px;display:grid;gap:2px;text-align:center}
.stat .v{font-family:var(--mono);font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1} .stat .l{font-size:.75rem;color:var(--muted)}

/* routine chips */
.routine{display:grid;gap:8px} .rchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none} .rchips::-webkit-scrollbar{display:none}
.rchip{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px 8px 8px;font-weight:600;font-size:.9rem;color:var(--fg);cursor:pointer;scroll-snap-align:start;white-space:nowrap;transition:transform .06s} .rchip:active{transform:scale(.97)}
.rchip .ck{width:20px;height:20px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:.72rem;background:var(--raise)}
.rchip.on{border-color:var(--accent-deep);background:var(--accent-soft)} .rchip.on .ck{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* logbook */
.lb{display:grid;gap:10px}
.lb .grp{display:flex;justify-content:space-between;align-items:baseline;padding:6px 2px 0;font-weight:600} .lb .grp span{color:var(--muted);font-family:var(--mono);font-size:.85rem}
.lb details.grp2{background:transparent;border:1px dashed var(--line2);border-radius:12px} .lb details.grp2 summary{padding:10px 12px;font-weight:600;display:flex;justify-content:space-between;color:var(--muted)} .lb details.grp2 .body{border-top:0;padding:0 8px 8px;display:grid;gap:8px}
.exr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.exr.done{border-color:var(--accent-deep)} .exr.done .exh .n{color:var(--muted)}
.exr .exh{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px 12px 10px;cursor:pointer}
.exr .exh .n{font-weight:600;font-size:1.05rem;display:flex;align-items:center;gap:8px;min-width:0} .exr .exh .n .ico{width:18px;height:18px;color:var(--accent)}
.exr .exh .d{color:var(--muted);font-size:.9rem;margin-top:1px} .exr .exh .d b{color:var(--accent);font-family:var(--mono);font-weight:400}
.exr .exh .a{display:flex;gap:6px;align-items:center}
.qbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--raise);color:var(--muted);cursor:pointer;padding:0;display:grid;place-items:center;text-decoration:none;font-weight:600}
.qbtn svg{width:16px;height:16px;fill:currentColor} .qbtn.go{color:var(--accent);border-color:var(--accent-deep)} .qbtn.go svg{stroke:none}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 1fr 44px;gap:6px;align-items:center;padding:0 12px 12px;font-variant-numeric:tabular-nums}
.sets .hd{font-size:.72rem;color:var(--muted);text-align:center;padding-bottom:2px} .sets .hd:first-child{text-align:left}
.sets .sn{font-family:var(--mono);color:var(--muted);font-size:.95rem}
.sets .pv{font-family:var(--mono);font-size:.85rem;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets input{padding:8px 4px;text-align:center;font-family:var(--mono);font-size:1.05rem;border-radius:8px;background:var(--raise);border:1px solid var(--line2);-moz-appearance:textfield} .sets input::-webkit-outer-spin-button,.sets input::-webkit-inner-spin-button{-webkit-appearance:none}
.sets .ck{width:44px;height:38px;border-radius:9px;border:1px solid var(--line2);background:var(--raise);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .06s,background .12s} .sets .ck svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sets .ck.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)} .sets .ck:active{transform:scale(.92)}
.sets .r.on input{color:var(--muted)} .sets .r.on .sn{color:var(--accent)}
.sets .pr{grid-column:1 / -1;font-family:var(--mono);font-size:.82rem;color:var(--accent);padding-top:2px}
.sets.one{grid-template-columns:1fr 44px} .sets.one .lbl{color:var(--muted);font-size:.95rem}
.exr .how{display:none;padding:0 14px 12px;border-top:1px dashed var(--line);font-size:.93rem;color:var(--muted)} .exr.open .how{display:grid;gap:6px;padding-top:10px} .exr .how ul{margin:0;padding-left:18px;display:grid;gap:3px} .exr .how b{color:var(--accent)} .exr .how a{color:var(--fg);font-weight:600}
.secline{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:.95rem} .secline b{color:var(--fg)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .rate button{padding:13px 6px;font-size:1rem} .rate button.sel{outline:3px solid var(--fg)}
.pbar{height:4px;background:var(--raise);border-radius:2px;overflow:hidden} .pbar i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* bottom bars */
.cta{position:sticky;bottom:calc(var(--tab) + 10px + env(safe-area-inset-bottom,0px));z-index:5;padding-top:6px;background:linear-gradient(180deg,transparent,var(--bg) 40%)}
#restbar{position:fixed;left:12px;right:12px;bottom:calc(var(--tab) + 10px + env(safe-area-inset-bottom,0px));z-index:8;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45);transform:translateY(130%);transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility 0s .22s;visibility:hidden;pointer-events:none}
#restbar.on{transform:none;visibility:visible;pointer-events:auto;transition:transform .22s cubic-bezier(.2,.8,.2,1)} #restbar .t{font-family:var(--mono);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums} #restbar .n{font-size:.9rem;opacity:.75;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} #restbar .n b{display:block;opacity:1;font-weight:600;color:var(--bg)}
#restbar button{background:var(--bg);color:var(--fg);border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em}
#restbar .bar{position:absolute;left:16px;right:16px;bottom:5px;height:2px;background:rgba(0,0,0,.15);border-radius:1px} #restbar .bar i{display:block;height:100%;background:var(--accent-deep);width:0;transition:width .25s linear}
.finbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:8px 8px 8px 16px}
.finbar .t{font-family:var(--mono);font-size:1.3rem} .finbar .s{font-size:.85rem;color:var(--muted)} .finbar .btn{padding:12px 18px;font-size:1.05rem}

/* week strip + plan */
.wkstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wkstrip button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 2px 8px;display:grid;justify-items:center;gap:5px;color:var(--fg);cursor:pointer;transition:transform .06s} .wkstrip button:active{transform:scale(.96)}
.wkstrip b{font-size:.72rem;color:var(--muted);font-weight:600} .wkstrip .ico{width:20px;height:20px;color:var(--fg)} .wkstrip .d{font-family:var(--mono);font-size:1.05rem;line-height:1}
.wkstrip button.off .ico,.wkstrip button.off .d{color:var(--muted);opacity:.5} .wkstrip button.sel{border-color:var(--accent);background:var(--accent-soft)} .wkstrip button.sel .ico{color:var(--accent)} .wkstrip button.today b{color:var(--accent)}
.wkstrip button.y::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)} .wkstrip button.miss::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--bad)}
.preview{display:grid;gap:10px}
.preview ul{list-style:none;margin:0;padding:0;display:grid;gap:4px} .preview li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.98rem} .preview li:last-child{border-bottom:0} .preview li span{color:var(--muted);font-family:var(--mono);font-size:.88rem;white-space:nowrap} .preview li.wc{color:var(--muted);font-size:.9rem}
.daycard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;cursor:pointer;color:var(--fg)}
.daycard.off{opacity:.6} .daycard.today{border-color:var(--accent-deep)} .daycard .dl b{font-family:var(--mono);font-size:1.05rem;display:block} .daycard .dt{font-weight:600} .daycard .chev{color:var(--muted);font-size:1.3rem}
.daycard .dl .ico{color:var(--accent);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:.92rem;color:var(--fg)} .chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none} summary::-webkit-details-marker{display:none}
details .body{padding:12px 14px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
details.fold{background:transparent;border:1px dashed var(--line2)} details.fold summary{font-size:.9rem;color:var(--muted);display:flex;justify-content:space-between} details.fold .body{border-top:0;padding-top:4px}

/* me */
.who{display:flex;align-items:center;gap:12px} .avatar{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.6rem;flex:none}
.who h1{font-size:2rem} .who .sub{margin-top:2px}
.prs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px} .prc{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:grid;gap:2px} .prc b{font-family:var(--mono);font-size:1.6rem;line-height:1;color:var(--fg)} .prc span{font-size:.8rem;color:var(--muted)} .prc small{font-family:var(--mono);font-size:.75rem;color:var(--muted)}

.bwv{font-family:var(--mono);font-size:1.9rem;line-height:1;margin-top:4px} .bwv small{font-family:var(--body);font-size:.85rem;color:var(--muted)} .spark{width:100%;height:52px;display:block}
.crewstrip{display:flex;gap:12px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none} .crewstrip::-webkit-scrollbar{display:none}
.cp{flex:0 0 auto;display:grid;justify-items:center;gap:3px;width:58px;text-align:center} .cp .av{position:relative;width:46px;height:46px;border-radius:50%;background:var(--surface);border:2px solid var(--line2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--muted)}

.hint{background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:.95rem;position:relative;margin-bottom:2px} .hint::after{content:"";position:absolute;left:28px;bottom:-7px;width:14px;height:14px;background:var(--fg);transform:rotate(45deg)}
.logfold summary{display:flex;justify-content:space-between}

.hbtn{background:var(--raise);border:1px solid var(--line2);border-radius:999px;padding:1px 8px;font-family:var(--mono);font-size:.72rem;color:var(--muted);cursor:pointer;margin-left:4px}

.exr .exh{grid-template-columns:auto 1fr auto} .exr .exh > div:first-child:not(.exthumb){grid-column:1 / 3} .exr .exh .exthumb + div{grid-column:2}
.ss{font-family:var(--mono);font-size:.72rem;color:var(--accent);border:1px solid var(--accent-deep);border-radius:6px;padding:1px 5px;margin-right:2px}
.exr.sss{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-style:dashed} .exr.ssm{border-radius:0;border-top:0;border-bottom-style:dashed} .exr.sse{border-top-left-radius:0;border-top-right-radius:0;border-top:0}

.trow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .trow div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px} .trow b{font-family:var(--mono);font-size:1.5rem;display:block;line-height:1} .trow span{font-size:.75rem;color:var(--muted)}

.fact{display:flex;gap:10px;margin-top:4px} .fbtn{background:none;border:0;padding:2px 0;color:var(--muted);font-size:.82rem;font-weight:600;cursor:pointer} .fbtn.like.on{color:var(--accent)} .cmts{display:grid;gap:4px;margin-top:4px} .cmt{font-size:.9rem;color:var(--muted);padding-left:10px;border-left:2px solid var(--line)} .cmt b{color:var(--fg)}
/* overlays */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tab) + 14px + env(safe-area-inset-bottom,0px));z-index:7;width:54px;height:54px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4);padding:0}

#wo .top{display:flex;justify-content:space-between;align-items:center;gap:10px}

#wo .cnt{color:var(--muted);font-size:.85rem;font-family:var(--mono)} #wo .acts{display:grid;gap:8px} #wo .next{color:var(--muted);font-size:.9rem;text-align:center}
#wo .cues{display:grid;gap:4px;text-align:left;max-width:36ch;font-size:.95rem;color:var(--muted)} #wo .cues ul{margin:0;padding:0} #wo .cues li{list-style:none} #wo .cues li::before{content:"▸ ";color:var(--accent)}
.done-wrap{display:grid;gap:14px;text-align:center;justify-items:center;padding:20px 0} .done-wrap .huge{font-family:var(--mono);font-size:3rem;line-height:1}

.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.big{width:30px;height:30px;color:var(--accent)} .ico.inl{width:16px;height:16px;vertical-align:-3px;margin-right:6px;color:var(--accent)}
.mark{flex:none;display:block} .authwrap .mark{margin:0 auto}
@keyframes prflash{0%{background:var(--accent-soft)}100%{background:transparent}} .exr.prflash{animation:prflash 1.2s ease-out}
