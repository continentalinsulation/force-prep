<!doctype html>
<html lang="en">
<head>

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&family=Share+Tech+Mono&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap"></noscript>
<style>
/* Palette: black / white / flat dark earth. FDE is the only accent; red only for a fail. */
:root{
  --bg:#0c0c0b; --bg2:#121211; --surface:#181817; --raise:#222220; --fg:#f3f1ec; --muted:#9c9890; --line:#2e2d2a;
  --accent:#c4a470; --accent-fg:#111009; --accent-soft:#2c2619; --bad:#d0533f; --bad-soft:#3a1c17;
  --display:"Stardos Stencil","Stencil","Impact","Arial Narrow",sans-serif; --mono:"Share Tech Mono","Menlo","Consolas",monospace; --body:"Barlow Semi Condensed","Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#f5f3ee; --bg2:#ecebe4; --surface:#ffffff; --raise:#f1efe8; --fg:#121211; --muted:#6a675f; --line:#d9d6cd; --accent:#8c6e3f; --accent-fg:#ffffff; --accent-soft:#eadfc8; --bad:#b33f2e; --bad-soft:#f3d6d0; color-scheme:light }}
:root[data-theme="light"]{ --bg:#f5f3ee; --bg2:#ecebe4; --surface:#ffffff; --raise:#f1efe8; --fg:#121211; --muted:#6a675f; --line:#d9d6cd; --accent:#8c6e3f; --accent-fg:#ffffff; --accent-soft:#eadfc8; --bad:#b33f2e; --bad-soft:#f3d6d0; color-scheme:light }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.05;text-wrap:balance;text-transform:uppercase;letter-spacing:.02em}
h1{font-size:2rem} h2{font-size:1.4rem}
.eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;font-size:.74rem;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:calc(90px + env(safe-area-inset-bottom,0px));max-width:620px;width:100%;margin:0 auto}
.view{display:grid;gap:16px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg2);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{flex:1;background:none;border:0;padding:10px 2px 8px;min-width:0;display:grid;gap:3px;justify-items:center;color:var(--muted);font-family:var(--body);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.66rem;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card.hi{border-color:var(--accent)}
.sub{color:var(--muted);font-size:.95rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:grid;gap:10px}
.pill{font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.btn{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:1rem;padding:13px 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;text-align:center}
.btn.quiet{background:var(--raise);border-color:var(--line);color:var(--fg)}
.btn.big{font-size:1.25rem;padding:16px 20px;width:100%}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.mini{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:.85rem;cursor:pointer;color:var(--fg)}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--raise);color:var(--fg);width:100%;min-width:0;font-variant-numeric:tabular-nums}
textarea{min-height:80px;resize:vertical}
.field{display:grid;gap:4px}
.field label{font-family:var(--mono);font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats.mini{gap:6px;min-width:200px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;display:grid;gap:2px;text-align:center}
.stat .v{font-family:var(--mono);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-family:var(--mono);font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.line{font-weight:600;font-size:1.15rem;line-height:1.2;text-wrap:balance;border-left:3px solid var(--accent);padding-left:12px}
.note{background:var(--accent-soft);border-left:4px solid var(--accent);padding:10px 12px;border-radius:8px;font-size:.95rem}
.note b{color:var(--accent)}
.sim-prep{background:var(--accent-soft);border-left:4px solid var(--accent);padding:10px 12px;border-radius:8px;font-size:.95rem}
ul.ex{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.ex li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--raise)}
ul.ex li.done{opacity:.5} ul.ex li.done .n{text-decoration:line-through} ul.ex li.cant{opacity:.45}
ul.ex input[type=checkbox]{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent)}
ul.ex label{cursor:pointer;min-width:0} ul.ex .n{font-weight:600} ul.ex .d{display:block;color:var(--muted);font-size:.92rem}
ul.ex .rest{font-family:var(--mono);font-size:.8rem;color:var(--accent)}
ul.ex .play{width:38px;height:38px;border-radius:50%;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer;padding:0;align-self:center}
ul.ex .play svg{width:16px;height:16px;fill:currentColor}
ul.ex .how{grid-column:1 / -1;display:none;gap:6px;padding:8px 0 2px;border-top:1px dashed var(--line);margin-top:4px;font-size:.93rem}
ul.ex li.open .how{display:grid} ul.ex .how b{color:var(--accent)} ul.ex .how a{color:var(--fg);font-weight:600}
ul.ex .howbtn{background:none;border:0;padding:0;color:var(--muted);font-size:.85rem;text-decoration:underline;cursor:pointer;margin-top:2px;text-align:left}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .rate button{padding:14px 6px} .rate button.sel{outline:3px solid var(--fg)}
.cd{font-family:var(--mono);font-size:2.3rem;font-variant-numeric:tabular-nums;line-height:1}
.adj{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--raise);color:var(--muted);border:1px solid var(--line)}
.adj.up{color:var(--accent);border-color:var(--accent)}
.rl{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.ring{width:54px;height:54px} .ring circle{fill:none;stroke-width:6} .ring .bgc{stroke:var(--raise)} .ring .fgc{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px}
summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none} summary::-webkit-details-marker{display:none}
details .body{padding:12px 14px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
.std{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.std .r{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center} .std .r:first-child{border-top:0}
.std .t{font-family:var(--mono);font-size:1.25rem;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap} .std small{display:block;color:var(--muted);font-size:.9rem}
.bigclock{font-family:var(--mono);font-size:4.2rem;font-variant-numeric:tabular-nums;line-height:1}
table{width:100%;border-collapse:collapse;font-size:.95rem;font-variant-numeric:tabular-nums} th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line)} th{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:400;font-size:.74rem;border-top:0}
.tscroll{overflow-x:auto} .ok{color:var(--accent);font-weight:700} .bad{color:var(--bad);font-weight:700}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px} .heat div{aspect-ratio:1;border-radius:4px;background:var(--raise);border:1px solid var(--line)} .heat div.y{background:var(--accent);border-color:var(--accent)} .heat div.r{background:var(--accent-soft);border-color:var(--accent-soft)} .heat div.t{outline:2px solid var(--fg);outline-offset:-2px} .heat div.f{opacity:.35}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.7rem;color:var(--muted);font-family:var(--mono)}
svg.chart{width:100%;height:auto;display:block}
.pr{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:center} .pr:first-child{border-top:0} .pr .v{font-family:var(--mono);font-size:1.2rem;color:var(--accent)} .pr small{color:var(--muted)}
.hist{display:grid} .hrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:center;font-size:.95rem} .hrow:first-child{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chip{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:.92rem;color:var(--fg)} .chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.daycard{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--fg)}
.daycard.off{opacity:.6} .daycard.today{border-color:var(--accent)} .daycard .dl b{font-family:var(--mono);font-size:1.1rem;display:block} .daycard .dt{font-weight:700} .daycard .chev{color:var(--muted);font-size:1.4rem}
.blist{display:grid;gap:8px} .bitem{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.member{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)} .member:first-child{border-top:0} .member .nm{font-weight:700} .member .st{font-family:var(--mono);font-size:1.1rem;color:var(--accent);text-align:right} .member .u{font-size:.75rem;color:var(--muted)}
.member .tod{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.85rem} .member .tod.y{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.code{font-family:var(--mono);font-size:1.4rem;letter-spacing:.2em;color:var(--accent)}
.board .rowb{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)} .board .rowb:first-child{border-top:0} .board .rk{font-family:var(--mono);color:var(--muted)} .board .sc{font-family:var(--mono);font-size:1.15rem;color:var(--accent)} .board .rowb.me .nm{color:var(--accent)}
.feed{display:grid} .fitem{padding:7px 0;border-top:1px solid var(--line);font-size:.95rem} .fitem:first-child{border-top:0} .fitem .who{font-weight:700} .fitem .when{color:var(--muted);font-family:var(--mono);font-size:.75rem;margin-left:6px}
.chrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:center} .chrow:first-child{border-top:0}
.authwrap{display:grid;gap:14px;max-width:420px;margin:12vh auto 0}
.logo{font-family:var(--display);font-weight:700;font-size:4.5rem;text-align:center;color:var(--accent);line-height:1;letter-spacing:.06em} .logo .bar{display:block;width:120px;height:4px;background:var(--fg);margin:6px auto 0}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;width:56px;height:56px;border-radius:50%;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);padding:0}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
#wo,#qt{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#wo .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
#wo .prog{height:6px;background:var(--raise);border-radius:3px;overflow:hidden;margin-top:10px} #wo .prog i{display:block;height:100%;background:var(--accent);width:0}
#wo .mid,#qt .mid{flex:1;display:grid;align-content:center;justify-items:center;text-align:center;gap:10px;padding:10px 0}
#wo .phase{font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;font-size:.9rem;color:var(--muted)} #wo .phase.work{color:var(--accent)}
#wo .name{font-family:var(--display);font-weight:700;font-size:2.2rem;line-height:1.05;text-transform:uppercase} #wo .det{color:var(--muted);font-size:1.05rem;max-width:34ch}
#wo .big,#qt .big{font-family:var(--mono);font-size:clamp(4.5rem,26vw,8.5rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em} #wo .big.rest{color:var(--muted)}
#wo .cnt{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-size:.8rem} #wo .acts{display:grid;gap:8px} #wo .next{color:var(--muted);font-size:.9rem;text-align:center}
#wo .cues{display:grid;gap:4px;text-align:left;max-width:36ch;font-size:.95rem;color:var(--muted)} #wo .cues ul{margin:0;padding:0} #wo .cues li{list-style:none} #wo .cues li::before{content:"▸ ";color:var(--accent)}
.done-wrap{display:grid;gap:14px;text-align:center;justify-items:center;padding:20px 0} .done-wrap .huge{font-family:var(--mono);font-size:3rem;line-height:1}
#qt .presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:420px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:30;font-size:.95rem;pointer-events:none;max-width:90vw;text-align:center}
ul.ex .acts2{display:flex;gap:6px;align-items:center;align-self:center}
.qbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--mono);cursor:pointer;padding:0}
ul.ex .how ul{margin:0;padding-left:18px;display:grid;gap:2px}
details.fold{background:transparent;border:1px dashed var(--line)} details.fold summary{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-size:.74rem;color:var(--muted);font-weight:400;display:flex;justify-content:space-between} details.fold .body{border-top:0;padding-top:4px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px} .wd{border:1px solid var(--line);border-radius:8px;padding:8px 2px;display:grid;justify-items:center;gap:2px;background:var(--raise)} .wd b{font-family:var(--mono);font-size:.78rem;color:var(--muted)} .wd span{font-family:var(--mono);font-size:1rem;min-height:1.2em} .wd.y{border-color:var(--accent);background:var(--accent-soft)} .wd.y span{color:var(--accent)} .wd.miss span{color:var(--bad)} .wd.off{opacity:.5} .wd.t{outline:2px solid var(--fg);outline-offset:-2px}
@media (prefers-reduced-motion: no-preference){ ul.ex li,#wo .prog i{transition:all .2s} }
</style>
</head>
<body>
<div id="app">
  <main>
    <section class="view" id="v-auth" hidden></section>
    <section class="view" id="v-setup" hidden></section>
    <section class="view" id="v-today" hidden></section>
    <section class="view" id="v-home" hidden></section>
    <section class="view" id="v-plan" hidden></section>
    <section class="view" id="v-dayedit" hidden></section>
    <section class="view" id="v-library" hidden></section>
    <section class="view" id="v-crew" hidden></section>
    <section class="view" id="v-crewdetail" hidden></section>
    <section class="view" id="v-me" hidden></section>
    <section class="view" id="v-test" hidden></section>
  </main>
  <nav class="tabs" id="tabs" hidden>
    <button data-v="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
    <button data-v="home"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>Dashboard</button>
    <button data-v="plan"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Plan</button>
    <button data-v="crew"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M15 14.5c2.8 0 5 2 5 4.5"/></svg>Crew</button>
    <button data-v="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>Me</button>
  </nav>
</div>
<button class="fab" id="fab" aria-label="Timer" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg></button>
<div id="qt" hidden></div>
<div id="wo" hidden></div>
<script>window.addEventListener("error",function(e){ try{ var d=document.createElement("pre"); d.style.cssText="position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#3a1c17;color:#fff;padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap;word-break:break-word"; d.textContent="App error: "+(e.message||e)+(e.filename?"\n"+e.filename.split("/").pop()+":"+e.lineno:""); document.body.appendChild(d);}catch(x){} });</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="exercises.js?v=8"></script>
<script src="app.js?v=8"></script>
</body>
</html>
