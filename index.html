<style>
/* Layout: phone-first app shell. Sticky header, scrolling view, fixed bottom tab bar. Dark-first — this is read at 05:15. */
:root{
  --bg:#121410; --bg2:#1a1d17; --surface:#20241d; --raise:#2a2f26; --fg:#ece9dd; --muted:#9a9f8c; --line:#343a30;
  --accent:#9ccc4f; --accent-fg:#0f120a; --accent-soft:#2a3a1c;
  --warn:#e2a24a; --warn-soft:#3b2d16; --bad:#e0624a; --bad-soft:#3d1f19;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f1f0e8; --bg2:#e9e8df; --surface:#ffffff; --raise:#f6f5ee; --fg:#1b1d16; --muted:#6a6e5e; --line:#d7d6ca;
  --accent:#4f6b2e; --accent-fg:#ffffff; --accent-soft:#e4ebd5;
  --warn:#9a5b16; --warn-soft:#f5e8d4; --bad:#b4442e; --bad-soft:#f6ddd8; color-scheme:light }}
:root[data-theme="light"]{
  --bg:#f1f0e8; --bg2:#e9e8df; --surface:#ffffff; --raise:#f6f5ee; --fg:#1b1d16; --muted:#6a6e5e; --line:#d7d6ca;
  --accent:#4f6b2e; --accent-fg:#ffffff; --accent-soft:#e4ebd5;
  --warn:#9a5b16; --warn-soft:#f5e8d4; --bad:#b4442e; --bad-soft:#f6ddd8; color-scheme:light }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1;text-wrap:balance}
.eyebrow{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;color:var(--muted)}
#app{min-height:100%;display:flex;flex-direction:column}
.hdr{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:max(14px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:1px solid var(--line)}
.hdr h1{font-size:1.9rem;font-weight:800;letter-spacing:.02em}
.hdr .pill{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:620px;width:100%;margin:0 auto}
.view{display:grid;gap:18px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg2);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 8px;display:grid;gap:3px;justify-items:center;color:var(--muted);font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card.hi{border-color:var(--accent)}
.card h2{font-size:1.7rem;font-weight:700}
.sub{color:var(--muted);font-size:.95rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:grid;gap:10px}
.btn{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:1.05rem;padding:13px 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:var(--raise);border-color:var(--line);color:var(--fg)}
.btn.big{font-size:1.3rem;padding:16px 20px;width:100%}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,nav.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ul.ex{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.ex li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--raise)}
ul.ex li.done{opacity:.5}
ul.ex li.done .n{text-decoration:line-through}
ul.ex input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent)}
ul.ex label{cursor:pointer}
ul.ex .n{font-weight:600}
ul.ex .d{display:block;color:var(--muted);font-size:.92rem}
.note{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 12px;border-radius:8px;font-size:.95rem}
.note b{color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;display:grid;gap:2px}
.stat .v{font-family:var(--display);font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--display);font-weight:600}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px}
summary{cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;font-family:var(--display);font-weight:600;font-size:1.1rem;text-transform:uppercase;letter-spacing:.05em;list-style:none}
summary::-webkit-details-marker{display:none}
summary .k{color:var(--muted);font-size:.9rem;letter-spacing:.08em}
details .body{padding:12px 14px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
details ul{margin:0;padding-left:20px;display:grid;gap:4px}
.std{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.std .r{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.std .r:first-child{border-top:0}
.std .t{font-family:var(--display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.std small{display:block;color:var(--muted);font-size:.9rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:grid;gap:3px}
.field label{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);font-weight:600}
input[type=text],input[type=date],input[type=number],select,textarea{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--raise);color:var(--fg);width:100%;min-width:0;font-variant-numeric:tabular-nums}
textarea{font:inherit;min-height:90px;resize:vertical}
table{width:100%;border-collapse:collapse;font-size:.95rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line)}
th{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;font-size:.82rem;border-top:0}
.tscroll{overflow-x:auto}
.ok{color:var(--accent);font-weight:700}.bad{color:var(--bad);font-weight:700}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat div{aspect-ratio:1;border-radius:4px;background:var(--raise);border:1px solid var(--line)}
.heat div.y{background:var(--accent);border-color:var(--accent)}
.heat div.r{background:var(--accent-soft);border-color:var(--accent-soft)}
.heat div.t{outline:2px solid var(--fg);outline-offset:-2px}
.heat div.f{opacity:.35}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.7rem;color:var(--muted);font-family:var(--display);letter-spacing:.06em}
svg.chart{width:100%;height:auto;display:block}
/* workout mode */
#wo{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;overflow-y:auto;flex-direction:column;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#wo .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
#wo .prog{height:6px;background:var(--raise);border-radius:3px;overflow:hidden;margin-top:10px}
#wo .prog i{display:block;height:100%;background:var(--accent);width:0}
#wo .mid{flex:1;display:grid;align-content:center;justify-items:center;text-align:center;gap:10px;padding:10px 0}
#wo .phase{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:.95rem;color:var(--muted)}
#wo .phase.rest{color:var(--warn)}
#wo .phase.work{color:var(--accent)}
#wo .name{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1}
#wo .det{color:var(--muted);font-size:1.05rem;max-width:34ch}
#wo .big{font-family:var(--display);font-weight:800;font-size:clamp(5rem,28vw,9rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#wo .big.rest{color:var(--warn)}
#wo .cnt{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
#wo .acts{display:grid;gap:8px}
#wo .next{color:var(--muted);font-size:.9rem;text-align:center}
.done-wrap{display:grid;gap:14px;text-align:center;justify-items:center;padding:20px 0}
.done-wrap .huge{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1}
#wo[hidden]{display:none}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:30;font-size:.95rem;pointer-events:none}
.phase-card{display:grid;gap:4px;padding:12px 14px;border-top:1px solid var(--line)}
.phase-card:first-child{border-top:0}
.phase-card.now{background:var(--accent-soft)}
.phase-card b{font-family:var(--display);font-weight:700;font-size:1.15rem;text-transform:uppercase;letter-spacing:.04em}
.phase-card span{color:var(--muted);font-size:.93rem}
.rl{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.ring{width:54px;height:54px}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--raise)}
.ring .fgc{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
.kv b{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-size:.85rem}

.line{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.15;letter-spacing:.01em;text-wrap:balance}
.pr{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.pr:first-child{border-top:0}
.pr .v{font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{padding:14px 6px}
.rate button.sel{outline:3px solid var(--fg)}
.cd{font-family:var(--display);font-weight:800;font-size:2.6rem;font-variant-numeric:tabular-nums;line-height:1}
.adj{display:inline-block;font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--raise);color:var(--muted);border:1px solid var(--line)}
.adj.up{color:var(--accent);border-color:var(--accent)}
.adj.dn{color:var(--warn);border-color:var(--warn)}
@media (prefers-reduced-motion: no-preference){ ul.ex li,#wo .prog i{transition:all .2s} }
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <div><div class="eyebrow" id="dateline">—</div><h1 id="hdrtitle">FORCE Prep</h1></div>
    <span class="pill" id="weekpill">Week —</span>
  </header>
  <main>
    <section class="view" id="v-today"></section>
    <section class="view" id="v-progress" hidden></section>
    <section class="view" id="v-test" hidden></section>
    <section class="view" id="v-program" hidden></section>
    <section class="view" id="v-more" hidden></section>
  </main>
  <nav class="tabs" id="tabs">
    <button data-v="today"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Today</button>
    <button data-v="progress"><svg viewBox="0 0 24 24"><path d="M4 19V11M10 19V5M16 19v-7M22 19H2"/></svg>Progress</button>

  </nav>
</div>
<div id="wo" hidden></div>

<script>
window.addEventListener("error",function(e){ try{ var d=document.createElement("pre"); d.style.cssText="position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#3d1f19;color:#fff;padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap;word-break:break-word"; d.textContent="App error: "+(e.message||e)+(e.filename?"\n"+e.filename+":"+e.lineno:""); document.body.appendChild(d);}catch(x){} });
</script>
<script>
(function(){
"use strict";
// ---------- data ----------
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var DSHORT=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var STD={rush:51,lift:210,shut:321};
var KEY="fp.v2";
var S=load();
function load(){
  var d=null;
  try{ d=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ d=null; }
  if(!d){
    d={start:"2026-10-19",done:{},routine:{},workouts:{},sims:[],notes:{},sound:true};
    try{
      var sims=JSON.parse(localStorage.getItem("force-sims")||"[]"); if(sims.length) d.sims=sims.map(function(s){return {date:s.date,rush:s.rush,lift:s.lift,shut:s.shut,drag:true};});
      for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); var m=/^force-(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(k);
        if(m){ var v=JSON.parse(localStorage.getItem(k)||"{}"); var dk=m[1]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[3]).slice(-2); d.done[dk]=v; } }
    }catch(e){}
  }
  d.done=d.done||{}; d.routine=d.routine||{}; d.workouts=d.workouts||{}; d.sims=d.sims||[]; d.notes=d.notes||{};
  d.evening=d.evening||{}; d.pr=d.pr||{pushups:[]}; d.adj=d.adj||{lift:0,bike:0}; d.feel=d.feel||{};
  if(d.sound===undefined) d.sound=true;
  d.testDate=d.testDate||"2027-01-12"; d.bedtime=d.bedtime||"21:45";
  return d;
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function iso(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function fromIso(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function today(){ var n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function weekOf(date){ var st=fromIso(S.start); return Math.max(1,Math.floor((date-st)/86400000/7)+1); }
function daysOut(){ return Math.round((fromIso(S.testDate)-today())/86400000); }
function secs(t){ if(t===undefined||t===null||t==="") return null; if(typeof t==="number") return t; var p=String(t).trim().split(":"); if(p.length===1){var f=parseFloat(p[0]);return isNaN(f)?null:f;} var v=parseInt(p[0],10)*60+parseFloat(p[1]); return isNaN(v)?null:v; }
function mmss(s){ if(s===null||s===undefined) return "—"; var m=Math.floor(s/60), r=Math.round(s-m*60); return m+":"+(r<10?"0":"")+r; }
function mmss1(ms){ var s=ms/1000; var m=Math.floor(s/60); var r=(s-m*60).toFixed(1); return m+":"+(r<10?"0":"")+r; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function hhmm(){ var n=new Date(); return ("0"+n.getHours()).slice(-2)+":"+("0"+n.getMinutes()).slice(-2); }

// ---------- lines ----------
var LINES=[
"Nobody is coming to do this for you. Good.",
"The alarm is on the dresser for a reason. Go get it.",
"You don't need to feel like it. You need to be downstairs.",
"Tired is the condition. It isn't the decision.",
"Ten minutes from now this is already done.",
"The streak doesn't care how you feel about it.",
"Standards don't negotiate. Neither do you.",
"You said you weren't going to be that guy. Prove it before 05:30.",
"Every rep is a vote for the guy who passes.",
"Motivation showed up late again. Start without it.",
"Hard now, or hard later in front of a PSP instructor.",
"The bag weighs the same as yesterday. You don't.",
"This is the part nobody sees. It's the only part that counts.",
"Be the guy who did it on the bad days.",
"Twenty minutes. You've lost longer arguing with yourself.",
"Comfort is a habit too. You're replacing it.",
"The test is one morning. This is every morning.",
"Quiet house, cold floor, no excuses. Perfect conditions.",
"You've done harder things half asleep in worse places.",
"Clock's running. Feet on the floor."];
function lineOf(date){ var n=Math.floor(date/86400000); return LINES[((n%LINES.length)+LINES.length)%LINES.length]; }

// ---------- program ----------
var ROUTINE=[["05:10 — alarm off, on the dresser","Feet on the floor before you touch it"],["Clothes from the bathroom","Laid out last night"],["Downstairs, workout done","Whatever today's session is"],["Coffee","After, not before"],["Twenty minutes of something that fires you up","Then phone down"],["Dressed and out the door",""]];
var EVENING=[["Clothes laid out in the bathroom","Everything, socks included"],["Alarm set 05:10, phone on the dresser","Not the nightstand. The dresser."],["Water bottle on the bike",""],["Lights out on time","Six hours is not enough. Seven and a half is the floor."]];
function phase(w){ return w<=2?1:w<=4?2:w<=6?3:4; }
var PHASES=[
  {n:"Foundation",w:"Weeks 1–2",d:"Learn the patterns at 20 kg, low reps, 2–3 in the tank. Bike 8 × 30/60."},
  {n:"Test movements",w:"Weeks 3–4",d:"Sandbag floor-to-shoulder replaces the basics. Bike 10 × 30/60. First timed sim."},
  {n:"Build",w:"Weeks 5–6",d:"Reps climb, carries get longer, bike moves to 40/80. Sim every second Saturday."},
  {n:"Peak and hold",w:"Week 7+",d:"Volume holds, sims every Saturday. You should be under every standard with room. Then we talk about running."}
];
function liftPlan(w){
  var ph=phase(w); var a=S.adj.lift; // -2..+3
  if(ph===1) return {kind:"lift",title:"Lift · foundation",sub:"Leave 2–3 reps in the tank every set. 90 s rest.",mins:25,
    blocks:[
      {k:"set",name:"Goblet squat",det:"Dumbbell or sandbag at the chest. Sit between the heels.",sets:3,reps:String(clamp(10+a*2,6,14)),rest:90},
      {k:"set",name:"Sandbag deadlift",det:"Hips back, chest up, bag tight to the shins. Drive the floor away.",sets:3,reps:String(clamp((w===1?6:8)+a,5,12)),rest:90},
      {k:"set",name:"Push-ups",det:"Max minus 2. Elbows at 45°, not flared.",sets:3,reps:"max − 2",rest:90},
      {k:"set",name:"Dumbbell row",det:"Per side. Pull to the hip, pause at the top.",sets:3,reps:"10 / side",rest:60},
      {k:"dur",name:"Plank",det:"Squeeze glutes, push the floor away.",sec:clamp(30+a*10,20,60),sets:3,rest:30}
    ],
    note:"<b>Weeks 1–2:</b> 20 kg bag, low reps. If the low back is lit up after this (not sore, lit up), pull an inner bag and go lighter for two weeks."};
  var base= ph===2?10:ph===3?12:15;
  var reps=clamp(base+a*2,8,20);
  var dl=clamp((ph===2?8:10)+a,6,14);
  var carry=clamp((ph===2?40:ph===3?60:80)+a*20,40,120);
  return {kind:"lift",title:"Lift · test movements",sub:"Add 2–3 reps or a little weight each week. 90 s rest.",mins:28,
    blocks:[
      {k:"set",name:"Sandbag floor-to-shoulder",det:"Alternate sides each rep. This is the lift station. Chest up, hips drive.",sets:3,reps:String(reps),rest:90},
      {k:"set",name:"Sandbag deadlift",det:"Add a plate on top when 3 sets feel easy.",sets:3,reps:String(dl),rest:90},
      {k:"set",name:"Push-ups",det:"Max minus 2.",sets:3,reps:"max − 2",rest:75},
      {k:"set",name:"Dumbbell row",det:"Per side.",sets:3,reps:"10 / side",rest:60},
      {k:"set",name:"Sandbag carry",det:"Bear-hug, walk tall. Don't let it drift to one hip.",sets:3,reps:carry+" m",rest:60},
      {k:"dur",name:"Plank",det:"",sec:clamp((ph===2?45:60)+a*10,30,90),sets:3,rest:30}
    ],
    note: ph===2?"<b>Weeks 3–4:</b> a rounded back on the lift is the thing to fix before adding reps.":"<b>Phase "+ph+":</b> the 30-rep station is about not gassing over 3:30. Keep adding reps, not weight."};
}
function bikePlan(w){
  var ph=phase(w); var a=S.adj.bike;
  var rounds=clamp((ph===1?8:ph===2?10:ph===3?10:12)+a,6,16);
  var on= ph<=2?30:40, off= ph<=2?60:80;
  if(a>=2&&ph<=2){ on=40; off=80; }
  return {kind:"bike",title:"Bike · intervals",sub:"Hard means you couldn't talk. Easy means you could.",mins:Math.round((300+rounds*(on+off)+180)/60),
    blocks:[
      {k:"dur",name:"Warm-up",det:"Easy spin. Let the legs wake up.",sec:300},
      {k:"int",name:"Intervals",det:rounds+" rounds · "+on+" s hard / "+off+" s easy",rounds:rounds,work:on,rest:off},
      {k:"dur",name:"Cool-down",det:"Easy spin.",sec:180}
    ],note:null};
}
function satPlan(w){
  if(w%2===1) return {kind:"circuit",title:"Saturday · outdoor circuit",sub:"Driveway or a field. Walk before you sprint.",mins:40,
    blocks:[
      {k:"dur",name:"Walk warm-up",det:"Brisk. Cold calves at 05:20 are where this goes wrong.",sec:180},
      {k:"set",name:"Burpee-sprint",det:"20 m sprint → drop to prone → up → sprint back. That's one rep. 4 reps a round.",sets:4,reps:"4 reps",rest:90},
      {k:"dur",name:"Loaded walk",det:"Sandbag or a loaded pack. Just walk.",sec:1500}
    ],
    note:"<b>Sprint volume stays at 16.</b> You're building the drop-and-go pattern, not a track programme."};
  return {kind:"sim",title:"Saturday · test simulation",sub:"All four stations, timed. This is the scoreboard.",mins:25,blocks:[],note:"<b>Run it from the Test tab.</b> Short breaks between stations, like the real thing. Times save automatically."};
}
var SUN={kind:"rest",title:"Sunday · off",sub:"The habit is the wake-up, not the workout.",mins:0,blocks:[{k:"dur",name:"Easy spin (optional)",det:"Only if you're worried about the streak. Then leave it.",sec:600}],note:null};
function planFor(date){ var d=date.getDay(), w=weekOf(date); if(d===1||d===3||d===5) return liftPlan(w); if(d===2||d===4) return bikePlan(w); if(d===6) return satPlan(w); return SUN; }

// ---------- adaptation ----------
function rate(kind,k,r){ // r: 1 easy, 2 right, 3 hard
  S.feel[k]=r; var key= kind==="lift"?"lift":kind==="bike"?"bike":null; if(!key){ save(); return null; }
  var hist=Object.keys(S.feel).filter(function(d){ var p=planFor(fromIso(d)); return p.kind===kind; }).sort(); var last2=hist.slice(-2).map(function(d){return S.feel[d];});
  var msg=null;
  if(r===3){ S.adj[key]=clamp(S.adj[key]-1,-2,3); msg="Holding the "+kind+" volume. Next one's a notch lighter."; }
  else if(r===1&&last2.length===2&&last2[0]===1&&last2[1]===1){ S.adj[key]=clamp(S.adj[key]+1,-2,3); msg="Two easy in a row. Next "+kind+" session steps up."; }
  save(); return msg;
}
function simVerdict(sim){
  var ok=0, margin=true; [["rush",STD.rush],["lift",STD.lift],["shut",STD.shut]].forEach(function(x){ var s=secs(sim[x[0]]); if(s!==null&&s<=x[1]) ok++; if(s===null||s>x[1]*0.9) margin=false; });
  if(ok===3&&sim.drag&&margin){ S.adj.lift=clamp(S.adj.lift+1,-2,3); S.adj.bike=clamp(S.adj.bike+1,-2,3); save(); return "All four under standard with 10% in hand. Program steps up."; }
  if(ok===3&&sim.drag) return "All four under standard. Hold the line and widen the margin."; 
  return (ok+(sim.drag?1:0))+" of 4. The misses are the program for the next two weeks.";
}

// ---------- streaks ----------
function dayComplete(date){
  var k=iso(date); var d=date.getDay();
  if(d===0) return true;
  if(S.workouts[k]) return true;
  var p=planFor(date); if(p.kind==="sim") return S.sims.some(function(s){return s.date===k;});
  var dn=S.done[k]; if(!dn) return false;
  var n=p.blocks.length; var c=0; for(var i=0;i<n;i++) if(dn["b"+i]) c++;
  return n>0 && c===n;
}
function routineComplete(date){ var r=S.routine[iso(date)]; if(!r) return false; for(var i=0;i<ROUTINE.length;i++) if(!r["r"+i]) return false; return true; }
function streak(fn){ var t=today(); var n=0; var d=new Date(t); if(!fn(d)) d.setDate(d.getDate()-1); for(var i=0;i<400;i++){ if(fn(d)){ n++; d.setDate(d.getDate()-1);} else break; } return n; }
function trainStreak(){ return streak(dayComplete); }
function routineStreak(){ return streak(routineComplete); }

// ---------- audio / haptics ----------
var AC=null;
function beep(f,ms,vol){
  if(!S.sound) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume();
    var o=AC.createOscillator(), g=AC.createGain(); o.type="square"; o.frequency.value=f; g.gain.value=vol||0.25;
    o.connect(g); g.connect(AC.destination); var t=AC.currentTime; o.start(t); g.gain.setValueAtTime(vol||0.25,t); g.gain.exponentialRampToValueAtTime(0.0001,t+ms/1000); o.stop(t+ms/1000+0.02);
  }catch(e){}
}
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
var lock=null;
function wake(on){ try{ if(on&&navigator.wakeLock) navigator.wakeLock.request("screen").then(function(l){lock=l;}).catch(function(){}); else if(lock){ lock.release().catch(function(){}); lock=null; } }catch(e){} }

function weekReview(t){
  var mon=new Date(t); mon.setDate(t.getDate()-6); var done=0, rd=0; var sims=[];
  for(var i=0;i<6;i++){ var d=new Date(mon); d.setDate(mon.getDate()+i); if(dayComplete(d)) done++; if(routineComplete(d)) rd++; }
  if(routineComplete(t)) rd++;
  S.sims.forEach(function(s){ var sd=fromIso(s.date); if(sd>=mon&&sd<=t) sims.push(s); });
  var w=weekOf(t); var nx=w+1; var ph=phase(nx), cph=phase(w);
  var change= ph!==cph? "Next week starts "+PHASES[ph-1].n+": "+PHASES[ph-1].d : (S.adj.lift||S.adj.bike)? "Adaptive: lifts "+(S.adj.lift>=0?"+":"")+S.adj.lift+", bike "+(S.adj.bike>=0?"+":"")+S.adj.bike+" on top of the phase." : "Same phase, same numbers. Keep stacking days.";
  var grade= done>=6?"Clean week.":done>=5?"Solid. One slipped.":done>=4?"Four of six. Fix the misses before they become the pattern.":"Under four. The routine's the problem, not the program.";
  return '<div class="card stack" style="border-color:var(--warn)"><div class="eyebrow">Week '+w+' review</div><h2>'+esc(grade)+'</h2><div class="stats"><div class="stat"><div class="v">'+done+'/6</div><div class="l">Sessions</div></div><div class="stat"><div class="v">'+rd+'/7</div><div class="l">Routine</div></div><div class="stat"><div class="v">'+(sims.length?simVerdictShort(sims[sims.length-1]):"—")+'</div><div class="l">Sim</div></div></div><div class="sub">'+esc(change)+'</div></div>';
}
function simVerdictShort(sim){ var ok=0; [["rush",STD.rush],["lift",STD.lift],["shut",STD.shut]].forEach(function(x){ var s=secs(sim[x[0]]); if(s!==null&&s<=x[1]) ok++; }); return (ok+(sim.drag?1:0))+"/4"; }
function ring(p){ var r=22, c=2*Math.PI*r; return '<svg class="ring" viewBox="0 0 54 54"><circle class="bgc" cx="27" cy="27" r="'+r+'"/><circle class="fgc" cx="27" cy="27" r="'+r+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-p))+'"/></svg>'; }

// ---------- WORKOUT ENGINE ----------
var W=null;
function expand(plan){
  var steps=[];
  plan.blocks.forEach(function(b,bi){
    if(b.k==="set"){ for(var s=1;s<=b.sets;s++){ steps.push({t:"work",name:b.name,det:b.det,sub:"Set "+s+" of "+b.sets+" · "+b.reps,b:bi,manual:true}); if(s<b.sets) steps.push({t:"rest",name:"Rest",det:"Next: "+b.name+" set "+(s+1),sec:b.rest,b:bi}); } }
    else if(b.k==="dur"&&b.sets){ for(var s2=1;s2<=b.sets;s2++){ steps.push({t:"work",name:b.name,det:b.det,sub:"Set "+s2+" of "+b.sets,sec:b.sec,b:bi}); if(s2<b.sets) steps.push({t:"rest",name:"Rest",det:"Next: "+b.name+" set "+(s2+1),sec:b.rest,b:bi}); } }
    else if(b.k==="dur"){ steps.push({t:"work",name:b.name,det:b.det,sub:"",sec:b.sec,b:bi,easy:true}); }
    else if(b.k==="int"){ for(var r=1;r<=b.rounds;r++){ steps.push({t:"work",name:"HARD",det:"Round "+r+" of "+b.rounds,sub:"",sec:b.work,b:bi}); steps.push({t:"rest",name:"EASY",det:r<b.rounds?"Round "+(r+1)+" is next":"Last one. Cool-down next.",sec:b.rest,b:bi}); } }
  });
  return steps;
}
function startWorkout(plan,k){
  var steps=expand(plan); if(!steps.length) return;
  W={plan:plan,k:k,steps:steps,i:0,t0:Date.now(),stepStart:Date.now(),paused:false,pausedAt:0,tick:null,lastBeep:-1};
  beep(880,80,0.001); wake(true);
  document.getElementById("wo").hidden=false; document.body.style.overflow="hidden";
  W.tick=setInterval(woTick,100); woRender();
}
function stepElapsed(){ return (W.paused?W.pausedAt:Date.now())-W.stepStart; }
function woTick(){
  if(!W||W.paused) return;
  var st=W.steps[W.i];
  if(st.sec){ var left=st.sec*1000-stepElapsed(); var s=Math.ceil(left/1000);
    if(s<=3&&s>=1&&s!==W.lastBeep){ W.lastBeep=s; beep(660,90); buzz(40); }
    if(left<=0){ beep(st.t==="rest"?1046:523,350,0.35); buzz([60,40,60]); next(); return; }
    var b=document.getElementById("wo-big"); if(b) b.textContent=mmss(Math.max(0,s)); }
  else { var b2=document.getElementById("wo-big"); if(b2) b2.textContent=mmss(Math.floor(stepElapsed()/1000)); }
  var tot=document.getElementById("wo-tot"); if(tot) tot.textContent=mmss(Math.floor((Date.now()-W.t0)/1000));
}
function next(){ W.i++; W.stepStart=Date.now(); W.lastBeep=-1; if(W.i>=W.steps.length){ finish(); return; } woRender(); }
function prev(){ if(W.i>0){ W.i--; W.stepStart=Date.now(); W.lastBeep=-1; woRender(); } }
function woRender(){
  var st=W.steps[W.i]; var el=document.getElementById("wo"); var nx=W.steps[W.i+1];
  var h='<div class="top"><div><div class="eyebrow">'+esc(W.plan.title)+'</div><div class="cnt">Step '+(W.i+1)+' / '+W.steps.length+' · <span id="wo-tot">0:00</span></div></div><button class="btn quiet" id="wo-x" style="padding:8px 12px">Exit</button></div>';
  h+='<div class="prog"><i style="width:'+Math.round(W.i/W.steps.length*100)+'%"></i></div>';

    h+='<div class="kv" style="margin-top:6px"><b>Latest</b><span>'+esc(last.date)+' · '+pass+' of '+tot+' stations under standard</span>'+[["rush","Rushes"],["lift","Lift"],["shut","Shuttles"]].map(function(x){ var s=secs(last[x[0]]); return '<b>'+x[1]+'</b><span class="'+(s===null?"":s<=STD[x[0]]?"ok":"bad")+'">'+(s===null?"—":mmss(s)+" / "+mmss(STD[x[0]]))+'</span>'; }).join("")+'</div>'; }

  h+='<div class="card"><div class="eyebrow" style="margin-bottom:6px">Personal bests</div><div class="pr"><div>Push-ups (one set)</div><div class="v">'+(puBest!==null?puBest:"—")+'</div></div><div class="pr"><div>Rushes<small style="display:block;color:var(--muted)">standard 0:51</small></div><div class="v">'+mmss(best("rush"))+'</div></div><div class="pr"><div>Sandbag lift<small style="display:block;color:var(--muted)">standard 3:30</small></div><div class="v">'+mmss(best("lift"))+'</div></div><div class="pr"><div>Loaded shuttles<small style="display:block;color:var(--muted)">standard 5:21</small></div><div class="v">'+mmss(best("shut"))+'</div></div><div class="pr"><div>Longest train streak</div><div class="v">'+longestStreak()+'</div></div></div>';

function longestStreak(){ var st=fromIso(S.start); var t=today(); var best=0,cur=0; for(var d=new Date(st); d<=t; d.setDate(d.getDate()+1)){ if(dayComplete(d)){ cur++; if(cur>best) best=cur; } else cur=0; } return best; }
function simTable(sims){
  if(!sims.length) return '<div class="sub">Nothing logged.</div>';
  var h='<div class="tscroll"><table><tr><th>Date</th><th>Rushes</th><th>Lift</th><th>Shuttles</th><th>Drag</th><th></th></tr>';
  sims.slice().reverse().forEach(function(s){ var idx=S.sims.indexOf(s);
    h+='<tr><td>'+esc(s.date.slice(5))+'</td>'+cell(s.rush,51)+cell(s.lift,210)+cell(s.shut,321)+'<td class="'+(s.drag?"ok":"bad")+'">'+(s.drag?"✓":"✗")+'</td><td><button class="btn quiet" data-del="'+idx+'" style="padding:4px 8px;font-size:.8rem">✕</button></td></tr>'; });
  return h+'</table></div>';
}
function cell(t,limit){ var s=secs(t); if(s===null) return '<td>—</td>'; return '<td class="'+(s<=limit?"ok":"bad")+'">'+mmss(s)+'</td>'; }
function simChart(sims){
  var Wd=600,Hh=240,pl=40,pr=12,pt=14,pb=28; var n=sims.length;
  var series=[["rush","Rushes","var(--accent)"],["lift","Lift","var(--warn)"],["shut","Shuttles","var(--fg)"]];
  var pts=series.map(function(sr){ return sims.map(function(s){ var v=secs(s[sr[0]]); return v===null?null:v/STD[sr[0]]*100; }); });
  var all=[].concat.apply([],pts).filter(function(x){return x!==null;}); if(!all.length) all=[100];
  var mx=Math.max(120,Math.ceil(Math.max.apply(null,all.concat([100]))/10)*10+5); var mn=Math.min(60,Math.floor(Math.min.apply(null,all)/10)*10-5);
  var x=function(i){ return n===1? (pl+(Wd-pl-pr)/2) : pl+i*(Wd-pl-pr)/(n-1); }, y=function(v){ return pt+(mx-v)/(mx-mn)*(Hh-pt-pb); };
  var h='<svg class="chart" viewBox="0 0 '+Wd+' '+Hh+'" role="img" aria-label="Sim times as a percentage of the standard">';
  for(var g=Math.ceil(mn/20)*20; g<=mx; g+=20){ h+='<line x1="'+pl+'" x2="'+(Wd-pr)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(y(g)+4)+'" font-size="11" text-anchor="end" fill="var(--muted)" font-family="var(--body)">'+g+'%</text>'; }
  h+='<line x1="'+pl+'" x2="'+(Wd-pr)+'" y1="'+y(100)+'" y2="'+y(100)+'" stroke="var(--bad)" stroke-width="2" stroke-dasharray="6 4"/><text x="'+(Wd-pr)+'" y="'+(y(100)-5)+'" font-size="11" text-anchor="end" fill="var(--bad)" font-family="var(--body)">standard</text>';
  series.forEach(function(sr,si){ var d="",first=true; pts[si].forEach(function(v,i){ if(v===null) return; d+=(first?"M":"L")+x(i).toFixed(1)+" "+y(v).toFixed(1)+" "; first=false; });
    if(d) h+='<path d="'+d+'" fill="none" stroke="'+sr[2]+'" stroke-width="2.5" stroke-linejoin="round"/>';
    pts[si].forEach(function(v,i){ if(v!==null) h+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="4" fill="'+sr[2]+'"/>'; }); });
  sims.forEach(function(s,i){ if(n<=8||i%Math.ceil(n/8)===0||i===n-1) h+='<text x="'+x(i)+'" y="'+(Hh-8)+'" font-size="11" text-anchor="middle" fill="var(--muted)" font-family="var(--body)">'+esc(s.date.slice(5))+'</text>'; });
  var lx=pl; series.forEach(function(sr){ h+='<rect x="'+lx+'" y="'+(Hh-24)+'" width="10" height="3" fill="'+sr[2]+'"/><text x="'+(lx+14)+'" y="'+(Hh-19)+'" font-size="11" fill="var(--muted)" font-family="var(--body)">'+sr[1]+'</text>'; lx+=70; });
  return h+'</svg>';
}

// ---------- MORE ----------
function renderMore(){
  var h='<div class="card stack"><div class="eyebrow">Settings</div><div class="grid2"><div class="field"><label for="m-start">Week 1 started (Mon)</label><input type="date" id="m-start" value="'+esc(S.start)+'"></div><div class="field"><label for="m-test">Test date</label><input type="date" id="m-test" value="'+esc(S.testDate)+'"></div><div class="field"><label for="m-bed">Lights out</label><input type="time" id="m-bed" value="'+esc(S.bedtime)+'"></div></div><label class="row" style="justify-content:flex-start"><input type="checkbox" id="m-sound" '+(S.sound?"checked":"")+' style="width:20px;height:20px;accent-color:var(--accent)"> Beeps during workouts</label><div class="row"><div class="sub">Adaptive offsets: lifts '+S.adj.lift+', bike '+S.adj.bike+'</div><button class="btn quiet" id="m-adj0" style="padding:6px 10px;font-size:.85rem">Reset to 0</button></div></div>';
  h+='<div class="card stack"><div class="eyebrow">Backup</div><div class="sub">Everything lives on this phone. Copy a backup now and then, or to move to a new phone.</div><div class="row"><button class="btn quiet" id="m-copy" style="flex:1">Copy backup</button><button class="btn quiet" id="m-paste" style="flex:1">Restore</button></div><textarea id="m-box" placeholder="Paste a backup here, then tap Restore" style="font-size:.8rem;min-height:60px"></textarea></div>';
  h+='<div class="card stack"><div class="eyebrow">Danger</div><button class="btn danger" id="m-reset">Wipe all data</button></div>';
  h+='<div class="sub" style="text-align:center">FORCE Prep v3</div>';
  var el=document.getElementById("v-more"); el.innerHTML=h;
  el.querySelector("#m-start").addEventListener("change",function(e){ if(e.target.value){ S.start=e.target.value; save(); renderHeader(); toast("Start date updated"); } });
  el.querySelector("#m-test").addEventListener("change",function(e){ if(e.target.value){ S.testDate=e.target.value; save(); renderHeader(); toast(daysOut()+" days out"); } });
  el.querySelector("#m-bed").addEventListener("change",function(e){ if(e.target.value){ S.bedtime=e.target.value; save(); toast("Lights out "+S.bedtime); } });
  el.querySelector("#m-sound").addEventListener("change",function(e){ S.sound=e.target.checked; save(); });
  el.querySelector("#m-adj0").addEventListener("click",function(){ S.adj={lift:0,bike:0}; save(); toast("Adaptive reset"); renderMore(); });
  el.querySelector("#m-copy").addEventListener("click",function(){ var txt=JSON.stringify(S); var box=el.querySelector("#m-box"); box.value=txt; try{ navigator.clipboard.writeText(txt).then(function(){toast("Copied");}).catch(function(){ box.select(); toast("Select and copy the text"); }); }catch(e){ box.select(); } });
  el.querySelector("#m-paste").addEventListener("click",function(){ try{ var d=JSON.parse(el.querySelector("#m-box").value); if(!d||!d.done) throw 0; try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} S=load(); toast("Restored"); renderHeader(); renderMore(); }catch(e){ toast("That's not a valid backup"); } });
  el.querySelector("#m-reset").addEventListener("click",function(){ var b=this; if(!b.dataset.ok){ b.dataset.ok="1"; b.textContent="Tap again to wipe everything"; return; } try{ localStorage.removeItem(KEY); localStorage.removeItem("force-sims"); }catch(e){} S=load(); S.done={}; S.sims=[]; save(); toast("Wiped"); renderHeader(); renderMore(); });
}

// ---------- boot ----------
renderHeader();
var hv=(location.hash||"").replace("#",""); show(["today","progress","test","program","more"].indexOf(hv)>=0?hv:"today");
document.addEventListener("visibilitychange",function(){ if(!document.hidden){ renderHeader(); if(!W&&!T) render(cur); } });
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(r){ try{ r.update(); }catch(e){} }).catch(function(){}); }
})();
</script>
</body>
</html>
