# Evolution · cloud builds for iOS (App Store / TestFlight) and Android (Play).
# Set up once in Codemagic: connect this GitHub repo, add an App Store Connect API key integration named "evolution_asc",
# and (for Android) upload a keystore as "evolution_keystore". Nothing secret lives in this file.
workflows:
  ios-release:
    name: iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: evolution_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ca.evolutionapp.evolution
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install
        script: npm ci
      - name: Build web and sync
        script: npm run sync
      - name: Pods
        script: cd ios/App && pod install
      - name: Signing
        script: xcode-project use-profiles
      - name: Build
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
  android-release:
    name: Android · Play (internal)
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      android_signing:
        - evolution_keystore
      node: 20
      java: 17
    scripts:
      - name: Install
        script: npm ci
      - name: Build web and sync
        script: npm run sync
      - name: Build AAB
        script: cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
